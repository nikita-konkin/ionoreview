name: Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore: ['references/**', 'datasets/**', 'reports/**', '**/*.md']
  pull_request:
    paths-ignore: ['references/**', 'datasets/**', 'reports/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
      MPLBACKEND: Agg
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/ionoreview-venv"
          & "$env:RUNNER_TEMP/ionoreview-venv/Scripts/python.exe" -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw "Build dependency installation failed" }
      - name: Test reviewer and packaging
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/ionoreview-venv/Scripts/python.exe" -m pytest tests/test_review.py tests/test_clustering.py tests/test_archive.py tests/test_packaging.py tests/test_experiment.py -q
          if ($LASTEXITCODE -ne 0) { throw "Reviewer tests failed" }
      - name: Build portable application and test frozen executable
        shell: pwsh
        run: ./tools/build_windows.ps1 -Python "$env:RUNNER_TEMP/ionoreview-venv/Scripts/python.exe" -OutputRoot "$env:RUNNER_TEMP/ionoreview-build"
      - name: Upload executable archive and checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IonoReview-windows-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ionoreview-build/IonoReview-windows-x64.zip
            ${{ runner.temp }}/ionoreview-build/IonoReview-windows-x64.zip.sha256
            ${{ runner.temp }}/ionoreview-build/frozen-self-test.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload failed executable self-test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: IonoReview-build-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/ionoreview-build/frozen-self-test.json
          if-no-files-found: warn
          retention-days: 7
